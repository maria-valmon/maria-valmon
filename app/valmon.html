<style>
/* Layout: app de una columna para el móvil, tarjetas-widget apiladas y barra de pestañas fija abajo.
   Un único aspecto, negro y rosa, elegido a propósito (sin modo claro). */
:root {
  --bg: #0b0a0c;
  --surface: #151317;
  --surface-2: #1e1b21;
  --line: #2c2730;
  --fg: #f6eef3;
  --muted: #a3949d;
  --pink: #ff4fa3;
  --pink-soft: #ff9fcc;
  --pink-ink: #1a0510;
  --muscle-off: #2a2530;
  --ok: #5fd6a4;
  --warn: #ffc46b;
  --display: "Bricolage Grotesque", "Manrope", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

.app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 110px; display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 32px; font-weight: 800; line-height: 1.05; }
h1 em { font-style: normal; color: var(--pink); }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.hot { background: var(--pink); color: var(--pink-ink); border-color: var(--pink); }
.card.hot .muted { color: color-mix(in srgb, var(--pink-ink) 70%, var(--pink)); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.stat small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 3px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.pink { background: color-mix(in srgb, var(--pink) 18%, transparent); color: var(--pink-soft); border-color: color-mix(in srgb, var(--pink) 40%, transparent); }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }

.btn { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; background: var(--pink); color: var(--pink-ink); }
.btn.ghost { background: transparent; color: var(--pink-soft); border: 1px solid color-mix(in srgb, var(--pink) 45%, transparent); }
.btn.quiet { background: var(--surface-2); color: var(--fg); }
.btn.sm { padding: 7px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--pink-soft); font-weight: 700; font-size: 13px; }
.app > .link { align-self: flex-start; }
[hidden] { display: none !important; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; overflow-wrap: anywhere; user-select: all; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set-row { display: grid; grid-template-columns: 40px 1fr 1fr 34px; gap: 8px; align-items: center; }
.set-row.head span { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; }
.set-row input { padding: 9px 8px; text-align: center; font-variant-numeric: tabular-nums; }
.set-row input::placeholder { color: color-mix(in srgb, var(--muted) 60%, transparent); }
.set-row.done input { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.setno { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 10px; height: 38px; font-weight: 800; font-variant-numeric: tabular-nums; }
.setno.warm { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.rest { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--pink) 16%, var(--surface-2)); }
.rest b { font-family: var(--display); font-size: 22px; margin-right: auto; }
.log-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.meal.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.meal .btn { align-self: flex-start; }
.msgs { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--pink); color: var(--pink-ink); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.msg h3 { font-size: 15px; }

.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.seg button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--pink); border-radius: 99px; }

.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; padding-top: 0; }
.box { flex: none; width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--pink); background: transparent; display: grid; place-items: center; color: var(--pink-ink); padding: 0; }
.box[aria-checked="true"] { background: var(--pink); }
.box svg { width: 16px; height: 16px; opacity: 0; }
.box[aria-checked="true"] svg { opacity: 1; }
.streak { font-size: 12px; font-weight: 700; color: var(--pink-soft); font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 3px; margin-top: 6px; }
.dots i { width: 9px; height: 9px; border-radius: 3px; background: var(--surface-2); }
.dots i.on { background: var(--pink); }

.list-item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.list-item:first-child { border-top: 0; padding-top: 0; }
.cover { flex: none; width: 46px; height: 64px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--display); font-weight: 800; color: var(--pink); font-size: 18px; }
.cover.pink { background: var(--pink); color: var(--pink-ink); border-color: var(--pink); }
.tap { background: none; border: 0; padding: 0; text-align: left; width: 100%; color: inherit; }

.quote { font-family: var(--display); font-size: 19px; font-weight: 500; line-height: 1.3; }
.chapter { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.chapter:first-of-type { border-top: 0; padding-top: 0; }
.kicker { font-size: 12px; font-weight: 700; color: var(--pink); letter-spacing: .06em; text-transform: uppercase; }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { text-align: right; padding: 8px 6px; border-top: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 12px; border-top: 0; }
.scroll-x { overflow-x: auto; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
.tabs nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.tabs button { background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; padding: 6px 0; border-radius: 12px; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--pink); }

.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; max-height: 88%; overflow-y: auto; padding: 20px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; }
input, select, textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; font-size: 16px; }
textarea { min-height: 84px; resize: vertical; }
.ex-pick { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.ex-pick input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--pink); flex: none; }
.ex-pick input[type="number"] { width: 64px; flex: none; padding: 6px 8px; }

.mood { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mood button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 2px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.mood button b { font-family: var(--display); font-size: 20px; color: var(--fg); }
.mood button[aria-pressed="true"] { background: var(--pink); color: var(--pink-ink); border-color: var(--pink); }
.mood button[aria-pressed="true"] b { color: var(--pink-ink); }
.strip { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.strip i { aspect-ratio: 1; border-radius: 5px; background: var(--surface-2); max-width: 100%; }

.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border-radius: 14px; border: 1px dashed color-mix(in srgb, var(--pink) 50%, transparent); font-size: 13px; color: var(--pink-soft); }
.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 30; }
svg text { font-family: var(--body); }
.switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.switch button { border: 0; background: transparent; color: var(--muted); border-radius: 10px; padding: 10px; font-weight: 700; font-size: 15px; }
.switch button[aria-pressed="true"] { background: var(--pink); color: var(--pink-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 600; text-align: left; }
.chip:hover { border-color: var(--pink); }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.qs { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.qs li::marker { color: var(--pink); font-weight: 700; }
.note { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
a.ext { color: var(--pink-soft); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere; }
.ai-out { background: var(--surface-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.ai-out ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.ai-out h3 { font-size: 15px; }
.stbtn { cursor: pointer; flex: none; min-width: 98px; justify-content: center; }
.hardbtn { border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 700; }
.hardbtn[aria-pressed="true"] { border-style: solid; border-color: var(--warn); color: var(--warn); }
.x { flex: none; background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; padding: 2px 6px; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: .6; } }
}
</style>

<script>
/* ============ Datos fijos: libro, biblioteca de ejercicios, plan, recomendaciones ============ */
const SEVEN = {

  chapters: [

    { id: 'h1', title: 'Hábito 1 · Sé proactiva', idea: 'Entre estímulo y respuesta hay un espacio en el que eliges. Pon tu energía en tu círculo de influencia, no en el de preocupación.',

        { id: 'h1b', type: 'daily', text: 'Haz una acción concreta dentro de tu círculo de influencia.' },
        { id: 'h1c', type: 'daily', text: 'Prueba de 30 días: cumple un pequeño compromiso contigo misma.' }] },
    { id: 'h2', title: 'Hábito 2 · Empieza con un fin en mente', idea: 'Todo se crea dos veces: primero en la mente, luego en la realidad. Una misión personal guía tus decisiones.',

l martes por la noche, y prepara también la bandeja de pavo al horno con patata para el martes y 200 g de compota de frutos rojos (calentados hasta que borboteen o hervidos 1 min) en 2 botes de 100 g. El miércoles por la tarde (unos 45 min) haz con el mismo sistema la ternera guisada con patatas del viernes y el sábado (300 g de ternera, 650 g de patata, 100 g de cebolla, 100 g de pimiento, 160 g de tomate triturado y 20 g de aceite; pesa el guiso terminado y divídelo entre 2), además del salteado de pavo completo para la comida del jueves, 1 huevo duro para la cena del sábado y otros 200 g de compota en 2 botes. La pasta, el salmón, las tortillas, los revueltos y la ensalada de atún se hacen en el momento en 10-15 min."};

const allChallenges = () => [...S.books.flatMap(b => (b.chapters || []).flatMap(c => c.challenges.map(ch => ({ ...ch, book: b, chapter: c })))),
  ...S.rel.map(e => ({ id: 'r-' + e.id, type: 'daily', text: relPractice(e) }))];
const isDone = (cid, day = today()) => (S.checks[cid] || []).includes(day);
function streak(cid) {
  const set = new Set(S.checks[cid] || []);
  let n = 0, i = set.has(today()) ? 0 : 1;
  while (set.has(daysAgo(i))) { n++; i++; }
  return n;
}
function bestStreak(cid) {
  const ds = [...(S.checks[cid] || [])].sort();
  let best = 0, cur = 0, prev = null;
  ds.forEach(k => { const d = fromKey(k); cur = prev && (d - prev) / 864e5 === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = d; });
  return best;
}
const lastWeight = () => S.weights.length ? S.weights[S.weights.length - 1].kg : 63;
function weeklySets() {
  const from = daysAgo(6), out = {};
  Object.keys(MUSCLES).forEach(k => out[k] = 0);
  S.workouts.filter(w => w.date >= from).forEach(w => w.ex.forEach(e => {
    Object.entries(exMuscles(e)).forEach(([k, f]) => { if (k in out) out[k] += f * setCount(e); });
  }));
  return out;
}
function energy(day = today()) {
  const p = S.profile, kg = lastWeight();
  const bmr = 10 * kg + 6.25 * p.height - 5 * ageOf(p.birth) - 161; // Mifflin-St Jeor, mujer
  const steps = (S.days[day] || {}).steps || 0;
  const stepK = steps * kg * 0.0005;               // ~0,03 kcal por paso a 63 kg
  const trained = S.workouts.some(w => w.date === day);
  const workK = trained ? 220 : 0;
  const active = (S.days[day] || {}).active || 0; // energía activa real de Salud, si la hay
  const tdee = Math.round(active ? bmr * 1.1 + active : bmr * 1.15 + stepK + workK);
  return { bmr: Math.round(bmr), steps, stepK: Math.round(stepK), workK, active, tdee, target: dayTotals(day).kcal || (tdee - p.deficit), planned: dayTotals(day).kcal > 0, menu: menuEatenKcal(day), extra: (S.days[day] || {}).intake || 0, intake: menuEatenKcal(day) + ((S.days[day] || {}).intake || 0) };
}

function weightChart() {
  const pts = S.weights.slice(-12);
  if (pts.length < 2) return pts.length ? `<p class="small muted">Punto de partida: <b class="num" style="color:var(--fg)">${fmt(pts[0].kg, 1)} kg</b> el ${fmtDay(pts[0].date)}. Pésate una vez por semana, en ayunas, y aquí verás la línea.</p>` : `<p class="muted small">Apunta tu primer pesaje.</p>`;
  const goal = S.profile.goalWeight;
  const W = 320, H = 150, L = 34, R = 10, T = 12, B = 24;
  const vals = pts.map(p => p.kg);
  let lo = Math.floor(Math.min(...vals, goal || Infinity) - .5), hi = Math.ceil(Math.max(...vals, goal || -Infinity) + .5);
  const x = i => L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.kg).toFixed(1)}`).join('');
  const area = `${line}L${x(pts.length - 1)},${H - B}L${x(0)},${H - B}Z`;
  const ticks = [lo, (lo + hi) / 2, hi];
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del peso">
    <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pink)" stop-opacity=".35"/><stop offset="1" stop-color="var(--pink)" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(t, t % 1 ? 1 : 0)}</text>`).join('')}
    ${goal ? `<line x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--pink-soft)" stroke-dasharray="4 4" stroke-width="1"/>

    <path d="${area}" fill="url(#wg)"/>
    <path d="${line}" fill="none" stroke="var(--pink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(last.kg)}" r="5" fill="var(--pink)" stroke="var(--bg)" stroke-width="2"/>
    <text x="${x(0)}" y="${H - 6}" font-size="10" fill="var(--muted)">${fmtDay(pts[0].date)}</text>
    <text x="${x(pts.length - 1)}" y="${H - 6}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtDay(last.date)}</text>
  </svg>`;
}

/* Análisis de Claude: devuelve JSON con el análisis, el tipo de situación, preguntas, una práctica y lecturas */
const REL_WHO = { pareja: 'con su pareja', familia: 'con su familia', amigos: 'con sus amigos', yo: 'consigo misma' };
function relSafetyRules() {
  return `SEGURIDAD, antes que nada:
- Si describe miedo, control, humillación o violencia por parte de otra persona: alerta "maltrato". No lo trates como un problema de su actitud y recomiéndale el 016 (o el 112 si hay peligro).
- Si aparecen ideas de hacerse daño o de no querer vivir: alerta "autolesion". Responde con mucho cuidado, anímala a hablar hoy con alguien y recomiéndale el 024 (gratis, 24 h) o el 112.
- Si sugiere conductas alimentarias de riesgo (atracones, purgas, restricción extrema, miedo a comer): alerta "alimentacion" y recomiéndale hablar con su médica o una psicóloga.`;
}
function relAnalysisPrompt(e) {
  const notes = (e.notes || []).slice(-3).map(n => '- ' + n.text).join('\n');
  return `Eres una psicóloga cálida, honesta y directa (no diagnosticas). María tiene ${ageOf(S.profile.birth)} años, vive en España y escribe sobre su relación ${REL_WHO[e.area]}.${readingCovey() ? ' Está leyendo "Los 7 hábitos de la gente altamente efectiva".' : ''}

Lo que escribe: """${e.text}"""
${notes ? `Reflexiones que ya ha escrito:\n${notes}\n` : ''}
${relSafetyRules()}

Analiza la situación y dale feedback sincero y útil, sin culpabilizar ni dorar la píldora. Responde SOLO con un objeto JSON con estas claves (texto en español de España, en segunda persona):
{"titulo": "resumen en 3-7 palabras",
 "tipo": uno de ${JSON.stringify(patsFor(e.area))},
 "lo_que_veo": "2-4 frases",
 "tu_parte": "2-3 frases sobre lo que depende de ella",
 "otra_mirada": "${e.area === 'yo' ? 'cómo se lo diría una buena amiga, 2-3 frases' : 'cómo puede estar viviéndolo la otra persona, 2-3 frases'}",
 "preguntas": ["3 preguntas para pensar"],
 "practica": "una práctica diaria que pueda marcar cada día, en imperativo, máximo 110 caracteres",
 "lecturas": [{"titulo": "título de la edición española", "autor": "...", "por_que": "una frase"}, {"titulo": "...", "autor": "...", "por_que": "..."}],
 "alerta": "" o "maltrato" o "autolesion" o "alimentacion"}`;
}
function cleanAnalysis(x, area) {
  if (!x || typeof x !== 'object' || Array.isArray(x)) return null;
  const s = (v, n) => typeof v === 'string' ? v.trim().slice(0, n) : '';
  const a = { titulo: s(x.titulo, 80), tipo: patsFor(area).includes(x.tipo) ? x.tipo : '', lo_que_veo: s(x.lo_que_veo, 1500), tu_parte: s(x.tu_parte, 1200), otra_mirada: s(x.otra_mirada, 1200),
    preguntas: (Array.isArray(x.preguntas) ? x.preguntas : []).map(q => s(q, 300)).filter(Boolean).slice(0, 4), practica: s(x.practica, 160),
    lecturas: (Array.isArray(x.lecturas) ? x.lecturas : []).filter(b => b && typeof b === 'object').map(b => ({ titulo: s(b.titulo, 120), autor: s(b.autor, 120), por_que: s(b.por_que, 300) })).filter(b => b.titulo).slice(0, 3),
    alerta: ['maltrato', 'autolesion', 'alimentacion'].includes(x.alerta) ? x.alerta : '', at: today() };
  return a.lo_que_veo || a.tu_parte ? a : null;
}
async function relAnalyze(id) {
  const e = S.rel.find(x => x.id === id); if (!e || !SAMPLE || (REL_RUN[id] && REL_RUN[id].kind)) return;
  const ctl = new AbortController(); REL_RUN[id] = { kind: 'analysis', ctl }; render();
  try {
    const raw = await SAMPLE.json(relAnalysisPrompt(e), { signal: ctl.signal, cache: false });
    const t = S.rel.find(x => x.id === id), a = t && cleanAnalysis(raw, t.area);
    if (t && a) { t.analysis = a; if (a.tipo) t.pattern = a.tipo; delete REL_RUN[id]; save(); }
    else REL_RUN[id] = { err: 'La respuesta no ha llegado completa. Vuelve a intentarlo.' };
  } catch (err) {
    if (AI_OFF.includes(err.code)) { SAMPLE = null; delete REL_RUN[id]; }
    else REL_RUN[id] = err.code === 'cancelled' ? undefined : { err: AI_ERR[err.code] || 'Se ha cortado la conexión. Vuelve a intentarlo.' };
    if (!REL_RUN[id]) delete REL_RUN[id];
  } finally { if (REL_RUN[id] && REL_RUN[id].kind) delete REL_RUN[id]; render(); }
}
async function relChat(id, text) {
  const e = S.rel.find(x => x.id === id); if (!e || !SAMPLE || (REL_RUN[id] && REL_RUN[id].kind) || !text) return;
  e.thread = (e.thread || []).concat({ role: 'user', content: text.slice(0, 4000), at: today() }).slice(-20); save();
  const ctl = new AbortController(); REL_RUN[id] = { kind: 'chat', ctl, text: '' }; render();
  try {
    const A = e.analysis, intro = `Eres una psicóloga cálida, honesta y directa (no diagnosticas) que acompaña a María, de ${ageOf(S.profile.birth)} años, en una situación de su relación ${REL_WHO[e.area]}.
Lo que escribió: """${e.text}"""
${A ? `Tu análisis anterior: ${A.lo_que_veo} ${A.tu_parte} ${A.otra_mirada}` : ''}
${(e.notes || []).length ? `Sus reflexiones: ${e.notes.slice(-3).map(n => n.text).join(' | ')}` : ''}
${relSafetyRules()}
Sigue la conversación en español de España, en segunda persona, con cariño y franqueza, en menos de 180 palabras. Si te pide un plan, que sea concreto.`;
    const turns = [{ role: 'user', content: intro }, ...e.thread.slice(-12).map(m => ({ role: m.role, content: m.content }))];
    const { text: answer } = await SAMPLE(turns, { signal: ctl.signal, cache: false, onText: ({ text: t }) => { if (REL_RUN[id]) { REL_RUN[id].text = t; const el = document.getElementById('relchat-live'); if (el) el.innerHTML = md(t); } } });
    const t = S.rel.find(x => x.id === id); if (t) { t.thread.push({ role: 'assistant', content: answer, at: today() }); t.thread = t.thread.slice(-20); }
  } catch (err) {
    const t = S.rel.find(x => x.id === id);
    if (AI_OFF.includes(err.code)) SAMPLE = null;
    else if (t && err.code === 'refused') { t.thread.pop(); toast(AI_ERR.refused); }
    else if (t && err.text) t.thread.push({ role: 'assistant', content: err.text + (err.code === 'cancelled' ? '\n\n(Parada)' : ''), at: today() });
    else if (err.code !== 'cancelled') toast(AI_ERR[err.code] || 'Se ha cortado la conexión. Vuelve a intentarlo.');
  } finally { delete REL_RUN[id]; save(); render(); }
}

async function ask(kind, id, extra) {

      onText: ({ text }) => { if (AI_RUN[id]) { AI_RUN[id].text = text; paintAi(id, saved()); } } });
    const t = aiTarget(kind, id); if (t) { t.ai = { text, date: today() }; save(); }

  if (kind === 'weight') { S.weights = S.weights.filter(w => w.date !== fd.date); S.weights.push({ date: fd.date, kg: n(fd.kg) }); S.weights.sort((a, b) => a.date.localeCompare(b.date)); }
  if (kind === 'measure') { const m = { date: fd.date }; ['cintura', 'cadera', 'gluteo', 'muslo', 'brazo'].forEach(k => m[k] = n(fd[k])); S.measures = S.measures.filter(x => x.date !== fd.date); S.measures.push(m); }
  if (kind === 'project') S.projects.push({ id: uid(), name: fd.name.trim(), area: fd.area.trim(), status: 'idea', tasks: fd.tasks.split('\n').map(t => t.trim()).filter(Boolean).map(text => ({ id: uid(), text, done: false })) });
  if (kind === 'chat') { const t = (fd.text || '').trim(); if (!t || CHAT.run || !SAMPLE) return; f.reset(); sendChat(t); return; }
  if (kind === 'slot') { if (!fd.when) return; S.diet.slot = fd.when; f.reset(); return commit('Hueco guardado'); }
  if (kind === 'nextshop') { if (!fd.date) return; S.diet.nextShop = fd.date; S.diet.slot = null; S.diet.have = []; f.reset(); return commit('Día de compra cambiado'); }
  if (kind === 'ask') { ask(f.dataset.kind, f.dataset.id, (fd.extra || '').trim()); return; }
  if (kind === 'relnew') { const t = (fd.text || '').trim(); if (!t) return; const id = uid(); S.rel.push({ id, area: UI.relArea, pattern: guessPattern(t, UI.relArea), text: t.slice(0, 5000), date: today(), status: 'abierto', notes: [], thread: [] }); UI.relId = id; window.scrollTo(0, 0); f.reset(); commit('Guardado'); if (SAMPLE) relAnalyze(id); return; }
  if (kind === 'relchat') { const t = (fd.text || '').trim(); if (!t) return; f.reset(); relChat(f.dataset.id, t); return; }
  if (kind === 'relnote') { const e = S.rel.find(x => x.id === f.dataset.id); (e.notes = e.notes || []).push({ date: today(), text: fd.text.trim() }); }
  if (kind === 'topic') { const id = uid(); S.topics.push({ id, key: '', name: fd.name.trim(), items: [], resources: [] }); UI.topicId = id; }
  if (kind === 'item') { if (!fd.text.trim()) return; S.topics.find(t => t.id === f.dataset.t).items.push({ id: uid(), text: fd.text.trim(), status: 'pendiente', hard: !!fd.hard }); f.reset(); return commit('Añadido'); }
  if (kind === 'res') { const url = safeUrl(fd.url); if (!url) return toast('Ese enlace no parece válido');
    S.topics.find(t => t.id === f.dataset.t).resources.push({ id: uid(), url, title: fd.title.trim() || hostOf(url), type: fd.type, note: fd.note.trim(), seen: false }); f.reset(); return commit('Enlace guardado'); }
  if (kind === 'task') { if (!fd.text.trim()) return; S.projects.find(p => p.id === f.dataset.p).tasks.push({ id: uid(), text: fd.text.trim(), done: false }); f.reset(); return commit(); }

  if (kind === 'page') { const b = S.books.find(x => x.id === UI.bookId); b.page = Math.min(b.pages, Math.max(0, n(fd.page) || 0)); b.status = fd.status; }
  if (kind === 'day') S.days[today()] = { ...(S.days[today()] || {}), steps: n(fd.steps) || 0, intake: n(fd.intake) || 0 };
  if (kind === 'profile') { ['height', 'deficit', 'stepGoal'].forEach(k => { if (n(fd[k]) != null) S.profile[k] = n(fd[k]); }); S.profile.goalWeight = n(fd.goalWeight); if (fd.birth) S.profile.birth = fd.birth; }
  if (kind === 'moodnote') S.moods[today()] = { ...(S.moods[today()] || {}), note: fd.note };
  f.reset(); UI.sheet = null; commit('Guardado');
});
setTimeout(checkHash, 0);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.sheet) { UI.sheet = null; render(); } });
render();
</script>
